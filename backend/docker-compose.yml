# Local dev dependencies only (Postgres + Redis).
# The backend itself runs via `npm run start:dev`, not in a container.
# Production uses Supabase (DB) + Upstash (Redis) instead — see .env.example.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
