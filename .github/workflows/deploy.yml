name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
    # Frontend deploys via Vercel; only redeploy the VM when backend code changes.
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ~/url-shortener
            git pull origin main
            cd backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart backend
